name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Testy jednostkowe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zaleznosci
        run: |
          pip install -r requirements-dev.txt

      - name: Uruchomienie testow
        env:
          DB_PATH: /tmp/test_magazyn.db
          SECRET_KEY: test-ci-key
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          pytest magazyn/tests/ -q --tb=line -m "not e2e and not production" --ignore=magazyn/tests/e2e

  e2e:
    name: Testy E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zaleznosci
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Uruchomienie testow E2E
        env:
          DB_PATH: /tmp/test_magazyn_e2e.db
          SECRET_KEY: test-ci-e2e-key
          CI: "true"
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          pytest \
            magazyn/tests/e2e/ \
            magazyn/tests/test_stocktake_ui.py \
            -m e2e \
            --browser chromium \
            -q --tb=short

  # Obraz multi-arch: amd64 (minipc) + arm64 (Oracle, failover magazynu).
  # Kazda architektura budowana natywnie na wlasnym runnerze (bez QEMU), push po digescie,
  # potem build_image sklada jeden manifest z tagami.
  build_arch:
    name: Build ${{ matrix.arch }}
    needs: [test, e2e]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Ustaw Buildx
        uses: docker/setup-buildx-action@v4

      - name: Logowanie do GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build i push (po digescie)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: magazyn/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/suchokrates1/retrievershop-suite-magazyn_app,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=magazyn-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=magazyn-${{ matrix.arch }}

      - name: Zapisz digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build_image:
    name: Manifest multi-arch i tagi
    needs: build_arch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Ustaw Buildx
        uses: docker/setup-buildx-action@v4

      - name: Logowanie do GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Utworz manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/suchokrates1/retrievershop-suite-magazyn_app
        run: |
          # main -> :latest + :<sha>; inna galaz (test recznym dispatchem) -> tylko :test-<sha>, bez ruszania :latest
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="-t ${IMAGE}:latest -t ${IMAGE}:${GITHUB_SHA}"
          else
            TAGS="-t ${IMAGE}:test-${GITHUB_SHA}"
          fi
          docker buildx imagetools create ${TAGS} $(printf "${IMAGE}@sha256:%s " *)
          for t in ${TAGS}; do [ "$t" = "-t" ] || docker buildx imagetools inspect "$t"; done

  deploy:
    name: Deploy na minipc
    needs: build_image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Polaczenie Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Backup bazy przed deployem
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 100.110.194.46
          # Port 22 na interfejsie Tailscale obsluguje Tailscale SSH i odrzuca tag:ci.
          # 2222 zostaje przy sshd i kluczu deploy.
          port: 2222
          username: suchokrates1
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            BACKUP_DIR="$HOME/backup/pre-deploy"
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            echo "Tworze backup produkcyjnej bazy przed deployem -> $BACKUP_FILE"
            if docker ps --format '{{.Names}}' | grep -qx retrievershop-magazyn; then
              if docker exec retrievershop-magazyn test -f /app/scripts/ops/refresh_allegro_token.py 2>/dev/null; then
                echo "Odswiezam token Allegro przed backupem..."
                docker exec retrievershop-magazyn python3 /app/scripts/ops/refresh_allegro_token.py \
                  || echo "UWAGA: odswiezenie tokenu Allegro nie powiodlo sie - backup kontynuowany"
              else
                echo "Pomijam odswiezenie tokenu (skrypt jeszcze nie w obrazie - pierwszy deploy po aktualizacji)"
              fi
            fi
            docker exec retrievershop-postgres pg_dump -U magazyn -d magazyn --clean --if-exists \
              | gzip > "$BACKUP_FILE"
            SIZE=$(stat -c%s "$BACKUP_FILE" 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 1000 ]; then
              echo "BLAD: backup wyglada na pusty/zepsuty (rozmiar=$SIZE bajtow) - przerywam deploy!"
              rm -f "$BACKUP_FILE"
              exit 1
            fi
            echo "Backup OK ($SIZE bajtow)"
            # Retencja: zachowaj tylko 20 najnowszych backupow pre-deploy
            cd "$BACKUP_DIR" && ls -t pre-deploy-*.sql.gz 2>/dev/null | tail -n +21 | xargs -r rm --

      - name: Deploy przez SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 100.110.194.46
          port: 2222
          username: suchokrates1
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            cd /home/suchokrates1/retrievershop-suite
            git fetch origin main
            git pull --ff-only origin main || echo "UWAGA: git pull nieudany, kontynuuje deploy obrazu"
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export MAGAZYN_IMAGE_TAG=latest
            docker compose pull magazyn_app
            docker compose up -d magazyn_app

      - name: Health check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 100.110.194.46
          port: 2222
          username: suchokrates1
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            check_container_health() {
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' retrievershop-magazyn 2>/dev/null || echo "unknown")
              echo "Health status: $STATUS"
              [ "$STATUS" = "healthy" ]
            }

            for attempt in 1 2 3; do
              echo "Health check attempt ${attempt}/3..."
              sleep 30
              if check_container_health; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "UWAGA: kontener nie jest healthy po 3 probach, sprawdzam logi..."
                docker logs --tail 30 retrievershop-magazyn
                exit 1
              fi
              echo "Ponawiam za 30s..."
            done

            echo "Sprawdzam /healthz i /login..."
            curl -fsS http://127.0.0.1:8000/healthz
            LOGIN_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/login)
            if [ "$LOGIN_CODE" != "200" ]; then
              echo "Login page HTTP $LOGIN_CODE (oczekiwano 200)"
              exit 1
            fi
            echo "Deploy OK - kontener healthy, /healthz i /login odpowiadaja"

      - name: Sync image do Oracle failover
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 100.110.194.46
          port: 2222
          username: suchokrates1
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            # Oracle jest arm64 i sam sciaga manifest z GHCR, tak jak cron 01:30.
            # docker save z minipc wyslalby obraz amd64; failover magazynu na Mikrusie jest wylaczony.
            tailscale ssh root@oracle "docker pull -q ghcr.io/suchokrates1/retrievershop-suite-magazyn_app:latest && docker image prune -f >/dev/null && docker image inspect ghcr.io/suchokrates1/retrievershop-suite-magazyn_app:latest --format '{{.Id}} {{.Architecture}} {{.Created}}'"
