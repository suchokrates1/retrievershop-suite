{% extends "base.html" %}
{% block content %}
<div class="container mx-auto mt-6 max-w-2xl" x-data="tiptopCartFill({
  items: {{ fill_items|tojson }},
  addUrl: {{ add_url|tojson }},
  basketUrl: {{ basket_url|tojson }}
})">
  <h1 class="text-2xl font-semibold mb-2">Koszyk TipTop</h1>
  <p class="text-sm text-base-content/70 mb-4" x-text="status"></p>

  <div class="mb-4" x-show="!running && !done">
    <button type="button" class="btn btn-primary" @click="start()">
      <i class="bi bi-cart-check"></i> Otwórz gotowy koszyk TipTop
    </button>
    <a href="{{ url_for('products.tiptop_reorder') }}" class="btn btn-ghost">← Wróć</a>
  </div>

  <div class="mb-4" x-show="running">
    <progress class="progress progress-primary w-full" :value="step" :max="items.length || 1"></progress>
    <p class="text-sm mt-2" x-text="'Dodaję ' + step + ' / ' + items.length + '…'"></p>
  </div>

  <div class="alert alert-error mb-4" x-show="error" x-text="error"></div>

  <h2 class="font-semibold mb-2">Pozycje ({{ items|length }})</h2>
  <ul class="mb-4 space-y-1 text-sm">
    {% for item in items %}
    <li>{{ item.quantity }}× {{ item.label }}</li>
    {% endfor %}
  </ul>
</div>

<script>
function tiptopCartFill(cfg) {
  return {
    items: cfg.items || [],
    addUrl: cfg.addUrl,
    basketUrl: cfg.basketUrl,
    running: false,
    done: false,
    step: 0,
    error: '',
    status: 'Kliknij, żeby napełnić koszyk TipTop i przejść do zamówienia.',
    sleep(ms) { return new Promise(r => setTimeout(r, ms)); },
    formHtml(fields) {
      const inputs = Object.entries(fields).map(([k, v]) =>
        `<input type="hidden" name="${k}" value="${String(v).replace(/"/g, '&quot;')}">`
      ).join('');
      return `<!DOCTYPE html><html><body>
        <form id="f" method="POST" action="${this.addUrl}">${inputs}</form>
        <script>document.getElementById('f').submit();<\/script>
      </body></html>`;
    },
    async start() {
      this.error = '';
      if (!this.items.length) {
        this.error = 'Brak pozycji do dodania.';
        return;
      }
      // Jedna pozycja — top-level POST w tym oknie (TipTop ustawia cookie i robi redirect do koszyka).
      if (this.items.length === 1) {
        const f = document.createElement('form');
        f.method = 'POST';
        f.action = this.addUrl;
        f.style.display = 'none';
        for (const [k, v] of Object.entries(this.items[0].fields || {})) {
          const inp = document.createElement('input');
          inp.type = 'hidden';
          inp.name = k;
          inp.value = v;
          f.appendChild(inp);
        }
        document.body.appendChild(f);
        f.submit();
        return;
      }
      const w = window.open('about:blank', 'tiptop_cart_fill');
      if (!w) {
        this.error = 'Przeglądarka zablokowała okno TipTop. Zezwól na wyskakujące okna dla magazynu i kliknij ponownie.';
        return;
      }
      this.running = true;
      this.status = 'Napełniam koszyk TipTop…';
      try {
        for (let i = 0; i < this.items.length; i++) {
          this.step = i + 1;
          const fields = this.items[i].fields || {};
          try {
            w.document.open();
            w.document.write(this.formHtml(fields));
            w.document.close();
          } catch (e) {
            w.location = 'about:blank';
            await this.sleep(350);
            w.document.open();
            w.document.write(this.formHtml(fields));
            w.document.close();
          }
          await this.sleep(2200);
          try { w.location = 'about:blank'; } catch (_) {}
          await this.sleep(300);
        }
        this.done = true;
        this.status = 'Gotowe — otwieram koszyk TipTop.';
        w.location = this.basketUrl;
        window.location.href = this.basketUrl;
      } catch (e) {
        this.error = String(e);
        this.running = false;
      }
    }
  }
}
</script>
{% endblock %}
